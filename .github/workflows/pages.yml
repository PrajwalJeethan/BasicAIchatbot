name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare static site
        env:
          TOM_API_URL: ${{ vars.TOM_API_URL }}
        run: |
          mkdir -p _site
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          api_url = os.environ.get("TOM_API_URL", "").rstrip("/")
          if not api_url:
              raise SystemExit("Set the TOM_API_URL repository Actions variable before deploying.")

          source = Path("templates/index.html").read_text(encoding="utf-8")
          placeholder = 'window.TOM_API_URL = "";'
          if source.count(placeholder) != 1:
              raise SystemExit("Could not find the unique TOM_API_URL placeholder in the page template.")

          page = source.replace(
              placeholder,
              f"window.TOM_API_URL = {json.dumps(api_url)};",
              1,
          )
          Path("_site/index.html").write_text(page, encoding="utf-8")
          PY

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
