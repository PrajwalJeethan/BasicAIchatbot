<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050b08">
  <title>Tom | ELIZA terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #f3f5f1;
      --surface: #ffffff;
      --ink: #202923;
      --muted: #727c75;
      --line: #dfe5dd;
      --green: #276b4f;
      --green-dark: #1f553e;
      --green-pale: #e9f2ec;
      --coral: #df795f;
      --shadow: 0 22px 70px rgb(36 55 43 / 9%);
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      background-color: var(--paper);
      background-image: linear-gradient(90deg, transparent 49.9%, rgb(39 107 79 / 3%) 50%, transparent 50.1%);
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .page { min-height: 100vh; display: flex; flex-direction: column; }
    .topbar {
      width: min(1120px, calc(100% - 48px));
      height: 82px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      width: 38px; height: 38px; display: grid; place-items: center;
      border-radius: 12px; background: var(--green); color: white;
      font-family: "Fraunces", Georgia, serif; font-size: 22px;
    }
    .brand-name { font-family: "Fraunces", Georgia, serif; font-size: 22px; }
    .brand-caption { margin-left: 3px; color: var(--muted); font-size: 13px; }
    .top-status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4a9a68; box-shadow: 0 0 0 3px #e0eee4; }
    main { flex: 1; display: grid; place-items: center; padding: 38px 24px 48px; }
    .chat-panel {
      width: min(760px, 100%); height: min(720px, calc(100vh - 168px)); min-height: 480px;
      display: flex; flex-direction: column; overflow: hidden;
      background: var(--surface); border: 1px solid #e2e7e0; border-radius: 14px; box-shadow: var(--shadow);
    }
    .chat-head { min-height: 78px; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .chat-heading { display: flex; align-items: center; gap: 12px; }
    .avatar { flex: 0 0 auto; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; background: var(--green-pale); color: var(--green); font-family: "Fraunces", Georgia, serif; font-size: 19px; }
    .chat-title { margin: 0; font-size: 15px; font-weight: 700; }
    .chat-subtitle { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .clear-button { border: 0; border-radius: 7px; padding: 9px 11px; background: transparent; color: var(--muted); font-size: 13px; }
    .clear-button:hover { background: #f1f4f0; color: var(--ink); }
    .messages { flex: 1; overflow-y: auto; list-style: none; margin: 0; padding: 30px clamp(18px, 5vw, 48px); display: flex; flex-direction: column; gap: 22px; scroll-behavior: smooth; }
    .message { display: flex; align-items: flex-start; gap: 11px; max-width: 88%; animation: arrive 180ms ease-out both; }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message .avatar { width: 30px; height: 30px; font-size: 15px; }
    .message.user .avatar { background: #f8ece7; color: #9e563f; font-family: "DM Sans", sans-serif; font-size: 11px; font-weight: 700; }
    .message-copy { min-width: 0; }
    .message-label { margin: 0 0 6px; color: var(--muted); font-size: 11px; font-weight: 600; }
    .message.user .message-label { text-align: right; }
    .bubble { margin: 0; padding: 12px 15px; border: 1px solid #e7ebe5; border-radius: 3px 13px 13px 13px; background: #f8faf7; color: #303a33; font-size: 14px; line-height: 1.65; overflow-wrap: anywhere; white-space: pre-wrap; }
    .message.user .bubble { border-color: #f1dfd8; border-radius: 13px 3px 13px 13px; background: #fbf2ee; }
    .composer { padding: 17px 22px 21px; border-top: 1px solid var(--line); }
    .composer-form { display: flex; gap: 10px; align-items: center; padding: 6px; border: 1px solid #dce3dc; border-radius: 10px; background: #fff; transition: border-color 140ms, box-shadow 140ms; }
    .composer-form:focus-within { border-color: #78a68a; box-shadow: 0 0 0 3px rgb(39 107 79 / 10%); }
    .composer-input { flex: 1; min-width: 0; height: 42px; padding: 0 10px; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 14px; }
    .composer-input::placeholder { color: #929b94; }
    .send-button { min-width: 82px; height: 42px; padding: 0 15px; border: 0; border-radius: 7px; background: var(--green); color: white; font-size: 13px; font-weight: 600; transition: background 140ms, transform 140ms; }
    .send-button:hover:not(:disabled) { background: var(--green-dark); transform: translateY(-1px); }
    .send-button:disabled { cursor: wait; opacity: .65; }
    .composer-note { min-height: 16px; margin: 9px 3px 0; color: var(--muted); font-size: 11px; }
    .typing { display: inline-flex; gap: 4px; padding: 5px 0; }
    .typing span { width: 5px; height: 5px; border-radius: 50%; background: #809287; animation: pulse 900ms ease-in-out infinite alternate; }
    .typing span:nth-child(2) { animation-delay: 150ms; }
    .typing span:nth-child(3) { animation-delay: 300ms; }
    @keyframes arrive { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { to { opacity: .3; transform: translateY(-3px); } }
    @media (max-width: 600px) {
      .topbar { width: calc(100% - 32px); height: 68px; }
      .brand-caption { display: none; }
      main { padding: 14px 10px 18px; }
      .chat-panel { height: calc(100vh - 98px); min-height: 420px; border-radius: 11px; }
      .chat-head { min-height: 68px; padding: 13px 15px; }
      .messages { padding: 23px 14px; gap: 18px; }
      .message { max-width: 94%; }
      .composer { padding: 12px 12px 14px; }
      .top-status { font-size: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }

    :root {
      color-scheme: dark;
      --paper: #050b08;
      --surface: #08110c;
      --ink: #b5d2bd;
      --muted: #668373;
      --line: #1a3526;
      --green: #76e49a;
      --green-dark: #9bf5b4;
      --green-pale: #0d2115;
      --shadow: 0 0 80px rgb(33 121 64 / 12%);
      --mono: "IBM Plex Mono", "Cascadia Code", "Courier New", monospace;
    }
    body {
      background-color: var(--paper);
      background-image: repeating-linear-gradient(0deg, transparent 0 5px, rgb(97 182 119 / 2%) 5px 6px), linear-gradient(90deg, transparent 49.9%, rgb(97 182 119 / 3%) 50%, transparent 50.1%);
      color: var(--ink);
      font-family: var(--mono);
    }
    button, input { font-family: var(--mono); }
    .topbar { width: min(940px, calc(100% - 48px)); height: 64px; border-color: var(--line); }
    .brand { gap: 10px; }
    .brand-mark { width: 30px; height: 30px; border: 1px solid #36724b; border-radius: 3px; background: #102719; color: var(--green); font-family: var(--mono); font-size: 16px; }
    .brand-name { color: var(--green); font-family: var(--mono); font-size: 15px; font-weight: 600; }
    .brand-caption { color: var(--muted); font-family: var(--mono); font-size: 11px; }
    .top-status { color: #8eb69b; font-family: var(--mono); font-size: 11px; text-transform: uppercase; }
    .status-dot { background: var(--green); box-shadow: 0 0 9px rgb(118 228 154 / 65%); }
    main { padding: 24px; }
    .chat-panel { position: relative; width: min(900px, 100%); height: min(760px, calc(100vh - 112px)); min-height: 460px; border: 1px solid #285339; border-radius: 4px; background: var(--surface); box-shadow: var(--shadow); }
    .chat-head { min-height: 58px; padding: 10px 18px; border-color: var(--line); background: #0b1710; }
    .chat-heading { gap: 10px; }
    .chat-head .avatar { width: 27px; height: 27px; border: 1px solid #36724b; border-radius: 3px; background: #102719; color: var(--green); font-family: var(--mono); font-size: 13px; }
    .chat-title { color: var(--green); font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: 0; text-transform: uppercase; }
    .chat-subtitle { margin-top: 2px; color: var(--muted); font-family: var(--mono); font-size: 10px; text-transform: uppercase; }
    .clear-button { border: 1px solid #285339; border-radius: 3px; padding: 7px 9px; color: #91b79c; font-size: 10px; text-transform: uppercase; }
    .clear-button:hover { background: #112519; color: var(--green); }
    .messages { gap: 13px; padding: 28px clamp(18px, 5vw, 42px); background-image: repeating-linear-gradient(0deg, transparent 0 5px, rgb(97 182 119 / 2%) 5px 6px); }
    .message, .message.user { align-self: stretch; flex-direction: row; gap: 0; max-width: 100%; }
    .message .avatar { display: none; }
    .message-copy { display: flex; align-items: baseline; gap: 12px; width: 100%; }
    .message-label, .message.user .message-label { flex: 0 0 48px; margin: 0; color: var(--green); font-size: 12px; font-weight: 600; text-align: left; text-transform: uppercase; }
    .message-label::after { content: ">"; margin-left: 3px; color: #4b8e61; }
    .message.user .message-label { color: #d7bd78; }
    .message.user .message-label::after { color: #a48a4d; }
    .bubble, .message.user .bubble { flex: 1; margin: 0; padding: 0; border: 0; border-radius: 0; background: transparent; color: #b5d2bd; font-family: var(--mono); font-size: 13px; line-height: 1.8; text-shadow: 0 0 10px rgb(118 228 154 / 12%); }
    .message.user .bubble { color: #d7dfca; }
    .composer { padding: 13px 22px 16px; border-color: var(--line); background: #09130d; }
    .composer-form { gap: 11px; padding: 4px 0; border: 0; border-radius: 0; background: transparent; }
    .composer-form:focus-within { border: 0; box-shadow: none; }
    .composer-form::before { content: "YOU>"; padding-left: 1px; color: #d7bd78; font-size: 12px; font-weight: 600; }
    .composer-input { height: 38px; padding: 0; color: var(--green); caret-color: var(--green); font-size: 13px; }
    .composer-input::placeholder { color: #526a59; }
    .composer-input:focus { outline: none; }
    .send-button { min-width: auto; height: 32px; padding: 0 10px; border: 1px solid #36724b; border-radius: 3px; background: #102719; color: var(--green); font-size: 10px; font-weight: 500; text-transform: uppercase; }
    .send-button:hover:not(:disabled) { transform: none; background: #173421; }
    .send-button:disabled { opacity: .5; }
    .composer-note { min-height: 14px; margin: 7px 0 0; color: #557260; font-family: var(--mono); font-size: 10px; }
    .typing span { background: var(--green); box-shadow: 0 0 5px rgb(118 228 154 / 55%); }
    @media (max-width: 600px) {
      .topbar { width: calc(100% - 28px); height: 56px; }
      .brand-caption { display: none; }
      main { padding: 12px 8px; }
      .chat-panel { height: calc(100vh - 80px); min-height: 400px; border-radius: 3px; }
      .chat-head { min-height: 54px; padding: 9px 11px; }
      .messages { padding: 21px 12px; gap: 12px; }
      .message-copy { gap: 8px; }
      .message-label, .message.user .message-label { flex-basis: 42px; font-size: 10px; }
      .bubble, .message.user .bubble { font-size: 12px; }
      .composer { padding: 10px 12px 12px; }
      .composer-form { gap: 8px; }
      .composer-form::before { font-size: 10px; }
      .composer-input { font-size: 12px; }
      .send-button { padding: 0 7px; }
      .top-status { font-size: 9px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand" aria-label="Tom chatbot">
        <span class="brand-mark" aria-hidden="true">T</span>
        <span class="brand-name">Tom</span>
        <span class="brand-caption">ELIZA / REFLECTION TERMINAL</span>
      </div>
      <div class="top-status"><span class="status-dot" aria-hidden="true"></span>System ready</div>
    </header>
    <main>
      <section class="chat-panel" aria-label="Conversation with Tom">
        <div class="chat-head">
          <div class="chat-heading">
            <span class="avatar" aria-hidden="true">T</span>
            <div><h1 class="chat-title">Tom // Eliza</h1><p class="chat-subtitle">Session open</p></div>
          </div>
          <button class="clear-button" id="clear-button" type="button">New session</button>
        </div>
        <ol class="messages" id="messages" aria-live="polite" aria-relevant="additions"></ol>
        <div class="composer">
          <form class="composer-form" id="chat-form">
            <input class="composer-input" id="message-input" type="text" placeholder="Type your response..." autocomplete="off" aria-label="Your message">
            <button class="send-button" id="send-button" type="submit">Enter</button>
          </form>
          <p class="composer-note" id="composer-note" aria-live="polite">Press Enter to send</p>
        </div>
      </section>
    </main>
  </div>
  <script>
    const messages = document.querySelector("#messages");
    const form = document.querySelector("#chat-form");
    const input = document.querySelector("#message-input");
    const sendButton = document.querySelector("#send-button");
    const note = document.querySelector("#composer-note");
    const greeting = "Hello, I’m Tom. What would you like to talk about?";

    function addMessage(role, text) {
      const item = document.createElement("li");
      item.className = `message ${role}`;
      const avatar = document.createElement("span");
      avatar.className = "avatar";
      avatar.setAttribute("aria-hidden", "true");
      avatar.textContent = role === "assistant" ? "T" : "YOU";
      const copy = document.createElement("div");
      copy.className = "message-copy";
      const label = document.createElement("p");
      label.className = "message-label";
      label.textContent = role === "assistant" ? "Tom" : "You";
      const bubble = document.createElement("p");
      bubble.className = "bubble";
      bubble.textContent = text;
      copy.append(label, bubble);
      item.append(avatar, copy);
      messages.append(item);
      messages.scrollTop = messages.scrollHeight;
      return item;
    }

    function resetConversation() {
      messages.replaceChildren();
      addMessage("assistant", greeting);
      input.disabled = false;
      sendButton.disabled = false;
      note.textContent = "Press Enter to send";
      input.focus();
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message || sendButton.disabled) return;

      addMessage("user", message);
      input.value = "";
      input.disabled = true;
      sendButton.disabled = true;
      note.textContent = "Tom is thinking…";
      const waiting = addMessage("assistant", "");
      const bubble = waiting.querySelector(".bubble");
      const typing = document.createElement("span");
      typing.className = "typing";
      typing.setAttribute("aria-label", "Tom is typing");
      for (let dot = 0; dot < 3; dot += 1) typing.append(document.createElement("span"));
      bubble.append(typing);

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Tom could not reply.");
        waiting.remove();
        addMessage("assistant", result.reply);
        if (result.ended) {
          input.disabled = true;
          note.textContent = "Start a new conversation whenever you’re ready.";
        } else {
          input.disabled = false;
          input.focus();
          note.textContent = "Press Enter to send";
        }
      } catch (error) {
        waiting.remove();
        addMessage("assistant", error.message || "I couldn’t connect just now. Please try again.");
        input.disabled = false;
        note.textContent = "Press Enter to try again";
        input.focus();
      } finally {
        sendButton.disabled = false;
      }
    });

    document.querySelector("#clear-button").addEventListener("click", resetConversation);
    resetConversation();
  </script>
</body>
</html>
